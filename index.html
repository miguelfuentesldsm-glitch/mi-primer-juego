<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fútbol Blue Lock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="lobby">
            <!-- Sala de lobby -->
            <h1>Bienvenido a la Sala de Lobby</h1>
            <button id="start-game">Iniciar Juego</button>
            <audio id="lobby-music" loop>
                <!-- Cambia 'Images/lobby-music.mp3' por la ruta real de tu archivo de audio -->
                <source src="Images/lobby-music.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento audio.
            </audio>
        </div>
        <canvas id="game-canvas"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
